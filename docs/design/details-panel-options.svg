<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="1200" viewBox="0 0 2220 1200" role="img" aria-labelledby="title desc">
  <title id="title">Nodrec Details panel layout options</title>
  <desc id="desc">Three static concepts for a content-sized Details panel: compact side panel, bottom inspector, and floating inspector.</desc>
  <defs>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#71bcff"/><stop offset="1" stop-color="#4d8fd0"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#272d37" stroke-width="1"/></pattern>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; fill: #d7dce5; }
      .muted { fill: #8591a2; }
      .small { font-size: 13px; }
      .tiny { font-size: 11px; }
      .label { font-size: 13px; fill: #98a4b4; }
      .value { font-size: 13px; fill: #d5dbe4; }
      .title { font-size: 21px; font-weight: 650; }
      .section { font-size: 11px; fill: #8f9bad; font-weight: 700; letter-spacing: 1.7px; }
      .card { fill: #1c1f25; stroke: #343a46; stroke-width: 1.5; }
      .field { fill: #20242b; stroke: #414957; stroke-width: 1.2; }
      .line { stroke: #343a45; stroke-width: 1; }
      .node { fill: #262a31; stroke: #4d5664; stroke-width: 1.4; }
      .nodehead { fill: #334354; }
    </style>
  </defs>
  <rect width="2220" height="1200" fill="#15171c"/>
  <text x="40" y="53" font-size="25" font-weight="700">Details 面板 · 静态方案</text>
  <text x="40" y="81" class="muted" font-size="14">三种内容高度布局，仅作选择稿。示例均以 Register Control 节点为选中对象。</text>

  <!-- Option A -->
  <g transform="translate(30 112)">
    <rect width="700" height="1048" rx="14" fill="#1a1d23" stroke="#343a46" stroke-width="1.5"/>
    <rect width="700" height="62" rx="14" fill="#232730"/>
    <text x="25" y="39" class="title">A · 右侧紧凑卡片</text>
    <rect x="0" y="62" width="700" height="690" fill="url(#grid)"/>
    <rect x="18" y="80" width="664" height="44" rx="8" fill="#1c2027" stroke="#343a46"/>
    <text x="35" y="108" class="small">4 nodes  ·  2 links</text>
    <rect x="268" y="285" width="242" height="132" rx="10" class="node"/>
    <path d="M278 285h222a10 10 0 0 1 10 10v29H268v-29a10 10 0 0 1 10-10" class="nodehead"/>
    <text x="290" y="312" font-size="14" font-weight="650">Register Operation Control</text>
    <text x="290" y="357" class="muted small">Execute</text>
    <text x="290" y="397" class="muted tiny">Record operations</text>
    <rect x="480" y="145" width="202" height="493" rx="10" class="card"/>
    <text x="499" y="173" class="section">DETAILS</text>
    <text x="499" y="198" font-size="15" font-weight="650">Register Operation Control</text>
    <text x="499" y="232" class="label">Node title</text>
    <rect x="499" y="241" width="164" height="34" rx="6" class="field"/><text x="510" y="263" class="value">Register Operation…</text>
    <text x="499" y="302" class="section">CONTROL</text>
    <text x="499" y="329" class="label">Label</text>
    <rect x="499" y="338" width="164" height="32" rx="6" class="field"/><text x="510" y="359" class="value">Record operations</text>
    <text x="499" y="397" class="label">Icon</text>
    <rect x="499" y="406" width="164" height="32" rx="6" class="field"/><text x="510" y="427" class="value">Mouse pointer  ▾</text>
    <text x="499" y="465" class="label">Event</text>
    <rect x="499" y="474" width="164" height="32" rx="6" class="field"/><text x="510" y="495" class="value">On Preview  ▾</text>
    <text x="499" y="533" class="label">Order</text>
    <rect x="499" y="542" width="75" height="32" rx="6" class="field"/><text x="511" y="563" class="value">2</text>
    <rect x="586" y="546" width="17" height="17" rx="4" fill="url(#blue)"/><path d="m590 554 4 4 6-7" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="608" y="559" class="label">Enabled</text>
    <text x="499" y="604" class="muted tiny">高度随字段数收缩；保持现有</text>
    <text x="499" y="621" class="muted tiny">右侧布局，画布宽度不变。</text>
    <text x="25" y="792" font-size="15" font-weight="650">右侧停靠 · 高度随内容</text>
    <text x="25" y="822" class="muted" font-size="13">结构稳定，字段少时不再拉满整列；节点画布依旧保留中间工作区。</text>
    <rect x="25" y="864" width="650" height="1" fill="#343a45"/>
    <text x="25" y="897" class="section">适合</text><text x="25" y="923" class="small">想保留当前右侧 Details 位置，优先减少空白。</text>
    <text x="25" y="971" class="section">取舍</text><text x="25" y="997" class="small muted">画布始终让出右侧宽度；窄窗口可滚动面板内容。</text>
  </g>

  <!-- Option B -->
  <g transform="translate(760 112)">
    <rect width="700" height="1048" rx="14" fill="#1a1d23" stroke="#343a46" stroke-width="1.5"/>
    <rect width="700" height="62" rx="14" fill="#232730"/>
    <text x="25" y="39" class="title">B · 画布下方属性栏</text>
    <rect x="0" y="62" width="700" height="690" fill="url(#grid)"/>
    <rect x="18" y="80" width="664" height="44" rx="8" fill="#1c2027" stroke="#343a46"/>
    <text x="35" y="108" class="small">4 nodes  ·  2 links</text>
    <rect x="212" y="239" width="254" height="138" rx="10" class="node"/>
    <path d="M222 239h234a10 10 0 0 1 10 10v30H212v-30a10 10 0 0 1 10-10" class="nodehead"/>
    <text x="235" y="267" font-size="14" font-weight="650">Register Operation Control</text>
    <text x="235" y="315" class="muted small">Execute</text>
    <text x="235" y="354" class="muted tiny">Record operations</text>
    <rect x="0" y="444" width="700" height="308" fill="#1c1f25" stroke="#454b57" stroke-width="1.5"/>
    <text x="23" y="474" class="section">DETAILS</text>
    <text x="23" y="499" font-size="15" font-weight="650">Register Operation Control</text>
    <text x="23" y="535" class="label">Node title</text>
    <rect x="23" y="544" width="278" height="34" rx="6" class="field"/><text x="35" y="566" class="value">Register Operation Control</text>
    <text x="327" y="535" class="label">Label</text>
    <rect x="327" y="544" width="348" height="34" rx="6" class="field"/><text x="339" y="566" class="value">Record operations</text>
    <text x="23" y="609" class="label">Icon</text>
    <rect x="23" y="618" width="198" height="34" rx="6" class="field"/><text x="35" y="640" class="value">Mouse pointer  ▾</text>
    <text x="239" y="609" class="label">Event</text>
    <rect x="239" y="618" width="248" height="34" rx="6" class="field"/><text x="251" y="640" class="value">On Preview  ▾</text>
    <text x="505" y="609" class="label">Order</text>
    <rect x="505" y="618" width="72" height="34" rx="6" class="field"/><text x="518" y="640" class="value">2</text>
    <rect x="599" y="626" width="17" height="17" rx="4" fill="url(#blue)"/><path d="m603 634 4 4 6-7" fill="none" stroke="#fff" stroke-width="1.5"/><text x="621" y="640" class="label">Enabled</text>
    <text x="23" y="701" class="muted tiny">栏高随内容自适应；多参数按两列排布，复杂配置可继续向下展开。</text>
    <text x="25" y="792" font-size="15" font-weight="650">底部停靠 · 横向属性栏</text>
    <text x="25" y="822" class="muted" font-size="13">让节点画布获得完整宽度；简单节点只占较矮一栏，复杂配置可增长。</text>
    <rect x="25" y="864" width="650" height="1" fill="#343a45"/>
    <text x="25" y="897" class="section">适合</text><text x="25" y="923" class="small">节点配置字段较多，希望横向并排编辑。</text>
    <text x="25" y="971" class="section">取舍</text><text x="25" y="997" class="small muted">占用画布下方高度；超长配置需要滚动工作区。</text>
  </g>

  <!-- Option C -->
  <g transform="translate(1490 112)">
    <rect width="700" height="1048" rx="14" fill="#1a1d23" stroke="#343a46" stroke-width="1.5"/>
    <rect width="700" height="62" rx="14" fill="#232730"/>
    <text x="25" y="39" class="title">C · 画布浮动检查器</text>
    <rect x="0" y="62" width="700" height="690" fill="url(#grid)"/>
    <rect x="18" y="80" width="664" height="44" rx="8" fill="#1c2027" stroke="#343a46"/>
    <text x="35" y="108" class="small">4 nodes  ·  2 links</text>
    <rect x="95" y="304" width="230" height="136" rx="10" class="node"/>
    <path d="M105 304h210a10 10 0 0 1 10 10v30H95v-30a10 10 0 0 1 10-10" class="nodehead"/>
    <text x="116" y="332" font-size="13" font-weight="650">Register Operation Control</text>
    <text x="116" y="378" class="muted small">Execute</text>
    <text x="116" y="416" class="muted tiny">Record operations</text>
    <rect x="355" y="145" width="327" height="452" rx="10" fill="#20242b" stroke="#5a6575" stroke-width="1.5"/>
    <rect x="355" y="145" width="327" height="42" rx="10" fill="#282d36"/>
    <text x="374" y="172" class="section">DETAILS</text><text x="650" y="172" class="muted">×</text>
    <text x="374" y="211" font-size="15" font-weight="650">Register Operation Control</text>
    <text x="374" y="246" class="label">Node title</text>
    <rect x="374" y="255" width="289" height="34" rx="6" class="field"/><text x="386" y="277" class="value">Register Operation Control</text>
    <text x="374" y="321" class="label">Label</text>
    <rect x="374" y="330" width="289" height="34" rx="6" class="field"/><text x="386" y="352" class="value">Record operations</text>
    <text x="374" y="396" class="label">Icon</text>
    <rect x="374" y="405" width="289" height="34" rx="6" class="field"/><text x="386" y="427" class="value">Mouse pointer  ▾</text>
    <text x="374" y="471" class="label">Event</text>
    <rect x="374" y="480" width="191" height="34" rx="6" class="field"/><text x="386" y="502" class="value">On Preview  ▾</text>
    <text x="583" y="471" class="label">Order</text>
    <rect x="583" y="480" width="80" height="34" rx="6" class="field"/><text x="596" y="502" class="value">2</text>
    <rect x="374" y="545" width="18" height="18" rx="4" fill="url(#blue)"/><path d="m378 553 4 4 6-7" fill="none" stroke="#fff" stroke-width="1.5"/><text x="401" y="559" class="label">Enabled</text>
    <text x="25" y="792" font-size="15" font-weight="650">浮动面板 · 锚定画布右上</text>
    <text x="25" y="822" class="muted" font-size="13">不固定占一列，画布空间最大；选中节点后显示，面板高度紧贴内容。</text>
    <rect x="25" y="864" width="650" height="1" fill="#343a45"/>
    <text x="25" y="897" class="section">适合</text><text x="25" y="923" class="small">希望节点画布尽量宽，并按需查看属性。</text>
    <text x="25" y="971" class="section">取舍</text><text x="25" y="997" class="small muted">浮层可能盖住附近节点；可拖动面板或收起解决。</text>
  </g>
</svg>
